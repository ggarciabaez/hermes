[settings]
delay = 0.5
log_dir = "./docs/log/"
pass_args = true
[settings.global]
dt = 16  # msecs

# Use the node package name, not the actual node name itself, to define the launch.
[params]
cfg = "./nodes/params/Config.toml"
priority = 0

[state-machine]
priority = 0

[gamepad-adapter]
priority = 1
wait_for_params = false
so_on = "so_forth"

# [load-test]
# priority = 9
 #n = 0

[bike]
twist_pub = "gpad"  # Should match with controller algo if named correctly.
v = 10.0
a = 5.0
steer = 0.3926991
l = 0.324

[controller]
algo = "gpad"

