[workspace]
resolver = "3"
members = [
  "crates/hermes-types",
  "nodes/gamepad-adapter"
, "nodes/state-machine"]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "process", "macros", "sync", "signal", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
zenoh = { version = "1.9.0", features = ["stats", "transport_compression"] }
futures = "0.3.33"
postcard = { version = "1.1.3", features = ["alloc"] }
botpad = {version = "0.1.4", features = ["tokio"]}

