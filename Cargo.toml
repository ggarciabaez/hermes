[workspace]
resolver = "3"
members = ["crates/hermes-macros",
  "crates/hermes-types",
  "nodes/gamepad-adapter", "nodes/load-test",
  "nodes/params",
  "nodes/state-machine",
  "tools/achilles",]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "process", "macros", "sync", "signal", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4.6.6" , features= ["derive"] }
zenoh = { version = "1.10.0", features = ["stats", "transport_compression"] }
futures = "0.3.34"
postcard = { version = "1.1.3", features = ["alloc"] }
botpad = { version = "0.1.4", features = ["tokio"] }
toml = "1.1.4"
rand = "0.10.2"
