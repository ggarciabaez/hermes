[workspace]
resolver = "3"
members = [
  "crates/hermes-types",
  "crates/gamepad-trigger",
  "nodes/gamepad-adapter"
]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
zenoh = { version = "1.9.0", features = ["stats", "transport_compression"] }
